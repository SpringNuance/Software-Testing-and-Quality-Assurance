<!DOCTYPE html>
<html>
  <head>
    <title>Place Bet</title>
  </head>
  <body>
    <h1>Place Your Bet</h1>
    <p>Name: {{ name }}</p>
    <p>Remaining Bet Points: {{ bet_points }}</p>
    <form method="post">
      <label for="bet">Enter your bet:</label>
      <input
        type="number"
        id="bet"
        name="bet"
        min="1"
        max="{{ bet_points }}"
        required
      />
      <button type="submit">Place Bet</button>
    </form>
  </body>
</html>
